# nginx для реле Soty #2 (vhost price.dcns.ru).
#
# Куда положить: /etc/nginx/vhosts-resources/price.dcns.ru/soty-ws.conf
# (этот include уже есть в обоих server{} исходного конфига, поэтому сайт
# править не нужно вообще). Полная замена конфига хоста — в README,
# раздел «Релей #2».
#
# Что делает:
#   /soty-ws        → ws://127.0.0.1:3100/ws        (WebSocket-эндпоинт)
#   /soty-status    → http://127.0.0.1:3100/status  (метрики для soty.su/status)
#   /soty-directory → http://127.0.0.1:3100/directory (каталог федерации)
#
# Публичный адрес реле: wss://price.dcns.ru/soty-ws
# Метрики: https://price.dcns.ru/soty-status
#
# Проверено: 101 Switching Protocols + WELCOME с ed25519
# dba88ecc7cd8053f76ddbe9c29d0bf63bb24e6234ebcaf9c074dcb0a1ce4b014.
# После правки: nginx -t && nginx -s reload.
# Если реле выключено, прокси вернёт 502 — сайт при этом не пострадает.

location = /soty-ws {
	proxy_pass http://127.0.0.1:3100/ws;
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";
	# Hestia/Apache vhosts hide the response Upgrade header; pass it back so
	# Dart (the app) accepts the 101. curl/host_probe do not check it.
	proxy_pass_header Upgrade;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto https;
	proxy_buffering off;
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;
}

location = /soty-status {
	limit_except GET { deny all; }
	proxy_pass http://127.0.0.1:3100/status;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto https;
	proxy_read_timeout 10s;
	proxy_send_timeout 10s;
}

location = /soty-directory {
	limit_except GET { deny all; }
	proxy_pass http://127.0.0.1:3100/directory;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto https;
	proxy_read_timeout 10s;
	proxy_send_timeout 10s;
}
