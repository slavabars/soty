# nginx: WebSocket-эндпоинт реле Soty #2 для vhost price.dcns.ru.
#
# Куда положить: /etc/nginx/vhosts-resources/price.dcns.ru/soty-ws.conf
# (этот include уже есть в обоих server{} исходного конфига, поэтому сайт
# править не нужно вообще). Полная замена конфига хоста — в README,
# раздел «Релей #2».
#
# Что делает: /soty-ws → ws://127.0.0.1:3100/ws, где слушает dtm_host.
# Публичный адрес реле: wss://price.dcns.ru/soty-ws
#
# Проверено: 101 Switching Protocols + WELCOME с ed25519
# dba88ecc7cd8053f76ddbe9c29d0bf63bb24e6234ebcaf9c074dcb0a1ce4b014.
# После правки: nginx -t && nginx -s reload.
# Если реле выключено, прокси вернёт 502 — сайт при этом не пострадает.

location = /soty-ws {
	proxy_pass http://127.0.0.1:3100/ws;
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto https;
	proxy_buffering off;
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;
}
