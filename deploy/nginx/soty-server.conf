# Soty relay — standalone nginx server{} with a WebSocket reverse proxy.
#
# Public endpoint example: ws://@@SERVER_NAME@@@@NGINX_PATH@@
# For wss:// add a second server{} on 443 with your certificate; see README.md.
# proxy_read_timeout 3600s is required: the 60s default would drop an idle
# subscription every minute.
server {
	listen 80;
	listen [::]:80;
	server_name @@SERVER_NAME@@;

	location = @@NGINX_PATH@@ {
		proxy_pass http://@@UPSTREAM@@/ws;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto @@SCHEME@@;
		proxy_buffering off;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}
}
