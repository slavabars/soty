# Soty relay — nginx location snippet for an existing server{} block.
#
# Include it inside the server{} that terminates your TLS, e.g.:
#     include /etc/nginx/conf.d/soty-location.conf;
# Public endpoint then: wss://your.host/soty-ws
#
# Adjust 127.0.0.1:3100 if the host listens elsewhere. proxy_read_timeout
# 3600s is required (the 60s default drops idle subscriptions).
location = /soty-ws {
	proxy_pass http://127.0.0.1:3100/ws;
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_buffering off;
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;
}
